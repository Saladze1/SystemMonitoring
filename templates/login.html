{% extends "base.html" %}

{% block title %}Login - Security System{% endblock %}

{% block extra_css %}
<style>
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
    }
    .login-box {
        background: #16213e;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,170,255,0.15);
        width: 340px;
    }
    .login-box h2 {
        text-align: center;
        color: #3b82f6;
        margin-bottom: 24px;
    }
    .login-box input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: none;
        border-radius: 6px;
        background: #0f3460;
        color: #fff;
        font-size: 0.9rem;
    }
    .login-box input::placeholder { color: #94a3b8; }
    .login-box button {
        width: 100%;
        padding: 12px;
        margin-top: 16px;
        border: none;
        border-radius: 6px;
        background: #3b82f6;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        font-size: 1rem;
    }
    .login-box button:hover { background: #2563eb; }
    .login-box .error {
        color: #f87171;
        text-align: center;
        margin-top: 10px;
        font-size: 0.875rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-box">
        <h2>🔒 Secure Login</h2>
        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</div>
{% endblock %}
