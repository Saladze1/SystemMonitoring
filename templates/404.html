{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div style="text-align:center; padding: 4rem 2rem;">
    <h1 style="font-size: 4rem; color: #dc2626; margin-bottom: 1rem;">404</h1>
    <p style="color: #94a3b8; margin-bottom: 2rem;">The page you requested does not exist.</p>
    <a href="{{ url_for('camera') if session.user_id else url_for('login') }}" class="btn">Back to Dashboard</a>
</div>
{% endblock %}
