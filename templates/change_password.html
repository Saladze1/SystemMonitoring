{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<h1>🔑 Change Password</h1>

<div style="max-width: 400px; background:#1e293b; padding:2rem; border-radius:0.5rem; border:1px solid #334155;">
    <form method="POST" action="{{ url_for('change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div style="margin-bottom:1rem;">
            <label style="display:block; margin-bottom:0.25rem; color:#94a3b8; font-size:0.875rem;">Current Password</label>
            <input type="password" name="current_password" required style="width:100%;">
        </div>
        <div style="margin-bottom:1rem;">
            <label style="display:block; margin-bottom:0.25rem; color:#94a3b8; font-size:0.875rem;">New Password (min 8 characters)</label>
            <input type="password" name="new_password" required style="width:100%;">
        </div>
        <div style="margin-bottom:1.5rem;">
            <label style="display:block; margin-bottom:0.25rem; color:#94a3b8; font-size:0.875rem;">Confirm New Password</label>
            <input type="password" name="confirm_password" required style="width:100%;">
        </div>
        <button type="submit" class="btn" style="width:100%;">Update Password</button>
    </form>
</div>
{% endblock %}
