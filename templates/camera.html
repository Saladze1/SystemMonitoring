{% extends "base.html" %} 
{% block title %}Camera Feed - Security System{% endblock %} 

{% block extra_css %} 
<style> 
.camera-container { 
    background: #1e293b; 
    border-radius: 0.75rem; 
    border: 1px solid #334155; 
    overflow: hidden; 
} 
.camera-header { 
    padding: 1rem 1.5rem; 
    background: #0f172a; 
    border-bottom: 1px solid #334155; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    flex-wrap: wrap; 
    gap: 1rem; 
} 
.camera-status { 
    display: flex; 
    align-items: center; 
    gap: 0.5rem; 
} 
.status-dot { 
    width: 8px; 
    height: 8px; 
    background: #94a3b8; 
    border-radius: 50%; 
} 
.camera-feed { 
    aspect-ratio: 16/9; 
    background: #000; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    position: relative; 
    overflow: hidden; 
    min-height: 300px; 
} 
.camera-feed video { 
    width: 100%; 
    height: 100%; 
    object-fit: cover;
}
.camera-overlay {
    position: absolute;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    color: #94a3b8;
    text-align: center;
    padding: 1rem;
}
.start-btn {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
    font-size: 1rem;
    cursor: pointer;
}
.start-btn:hover { background: #2563eb; }
.camera-info { 
    padding: 1rem 1.5rem; 
    display: flex; 
    justify-content: space-between; 
    color: #94a3b8; 
    font-size: 0.875rem; 
    flex-wrap: wrap; 
    gap: 0.5rem; 
} 
</style> 
{% endblock %} 

{% block content %} 
<div class="camera-container"> 
    <div class="camera-header"> 
        <h2>Live Camera Feed</h2> 
        <div style="display:flex; align-items:center; gap:1rem; flex-wrap:wrap;"> 
            <div class="camera-status"> 
                <div class="status-dot" id="statusDot"></div> 
                <span style="color: #94a3b8; font-size: 0.875rem;" id="statusText">STARTING...</span> 
            </div> 
        </div> 
    </div> 
    
    <div class="camera-feed" id="feedContainer"> 
        <video id="cameraVideo" autoplay playsinline muted></video>
        <div class="camera-overlay" id="overlay">
            <p id="overlayMsg"></p>
            <button class="start-btn" id="startBtn" style="display:none;" onclick="startCamera()">▶ Start Camera</button>
        </div>
    </div> 
    
    <div class="camera-info"> 
        <span>Camera 1 - Main Entrance</span> 
        <span id="timestamp">{{ now().strftime('%Y-%m-%d %H:%M:%S UTC') }}</span> 
    </div> 
</div> 
{% endblock %} 

{% block extra_js %} 
<script> 
const video = document.getElementById('cameraVideo');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const overlay = document.getElementById('overlay');
const overlayMsg = document.getElementById('overlayMsg');
const startBtn = document.getElementById('startBtn');

function setStatus(color, text, textColor) {
    statusDot.style.background = color;
    statusText.textContent = text;
    statusText.style.color = textColor || color;
}

function showOverlay(msg, showButton) {
    overlay.style.display = 'flex';
    overlayMsg.textContent = msg;
    startBtn.style.display = showButton ? 'inline-block' : 'none';
}

function hideOverlay() {
    overlay.style.display = 'none';
}

function startCamera() {
    setStatus('#f59e0b', 'CONNECTING...', '#f59e0b');
    hideOverlay();

    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(stream => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play()
                    .then(() => {
                        setStatus('#22c55e', 'LIVE', '#22c55e');
                        hideOverlay();
                    })
                    .catch(() => {
                        // play() rejected — still try to show frame
                        setStatus('#22c55e', 'LIVE', '#22c55e');
                        hideOverlay();
                    });
            };
        })
        .catch(err => {
            if (err.name === 'NotAllowedError') {
                setStatus('#dc2626', 'OFFLINE', '#dc2626');
                showOverlay('Camera permission denied. Allow access in your browser settings and refresh.', false);
            } else {
                setStatus('#dc2626', 'OFFLINE', '#dc2626');
                showOverlay('Camera error: ' + err.message, true);
            }
        });
}

// Start automatically on page load
startCamera();

// Update timestamp every second 
setInterval(() => { 
    const el = document.getElementById('timestamp'); 
    if (el) { 
        const now = new Date(); 
        el.textContent = now.toISOString().slice(0,19).replace('T',' ') + ' UTC'; 
    } 
}, 1000); 
</script> 
{% endblock %}
