<!DOCTYPE html>
<html>
<head>
    <title>Camera Feed</title>
</head>
<body>
    <h2>Welcome, {{ session['username'] }} ({{ session['role'] }})</h2>

    <video id="video" width="640" height="480" autoplay playsinline></video>
    <br>
    <button id="startBtn">Start Camera</button>
    <button id="captureBtn" disabled>Capture Photo</button>
    <a href="{{ url_for('logout') }}">Logout</a>

    {% if session['role'] == 'admin' %}
        <a href="{{ url_for('logs') }}">View Logs</a>
        <a href="{{ url_for('users') }}">Manage Users</a>
    {% endif %}

    <br>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>
    <img id="photo" alt="">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p style="color: {{ 'red' if category == 'error' else 'green' }}">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photo = document.getElementById('photo');
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');
        let stream = null;

        // Start camera on button click (avoids autoplay issues)
        startBtn.addEventListener('click', () => {
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(s => {
                    stream = s;
                    video.srcObject = stream;
                    startBtn.disabled = true;
                    captureBtn.disabled = false;
                })
                .catch(err => {
                    alert('Camera access denied or unavailable: ' + err.message);
                });
        });

        // Capture a still frame
        captureBtn.addEventListener('click', () => {
            canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
            canvas.style.display = 'block';
            photo.src = canvas.toDataURL('image/png');
        });
    </script>
</body>
</html>
