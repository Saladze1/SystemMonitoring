{% extends "base.html" %}

{% block title %}Camera Feed - Security System{% endblock %}

{% block extra_css %}
<style>
    .camera-container {
        background: #1e293b;
        border-radius: 0.75rem;
        border: 1px solid #334155;
        overflow: hidden;
    }
    .camera-header {
        padding: 1rem 1.5rem;
        background: #0f172a;
        border-bottom: 1px solid #334155;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .camera-status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .status-dot {
        width: 8px;
        height: 8px;
        background: #22c55e;
        border-radius: 50%;
        animation: pulse 2s infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
    .camera-feed {
        aspect-ratio: 16/9;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #64748b;
        font-size: 1.25rem;
    }
    .camera-info {
        padding: 1rem 1.5rem;
        display: flex;
        justify-content: space-between;
        color: #94a3b8;
        font-size: 0.875rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="camera-container">
    <div class="camera-header">
        <h2>Live Camera Feed</h2>
        <div class="camera-status">
            <div class="status-dot"></div>
            <span style="color: #22c55e; font-size: 0.875rem;">LIVE</span>
        </div>
    </div>
    <div class="camera-feed">
        <div>Camera Feed Placeholder</div>
    </div>
    <div class="camera-info">
        <span>Camera 1 - Main Entrance</span>
        <span>{{ now.strftime('%Y-%m-%d %H:%M:%S UTC') }}</span>
    </div>
</div>
{% endblock %}
