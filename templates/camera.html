{% extends "base.html" %} 
{% block title %}Camera Feed - Security System{% endblock %} 

{% block extra_css %} 
<style> 
.camera-container { 
    background: #1e293b; 
    border-radius: 0.75rem; 
    border: 1px solid #334155; 
    overflow: hidden; 
} 
.camera-header { 
    padding: 1rem 1.5rem; 
    background: #0f172a; 
    border-bottom: 1px solid #334155; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    flex-wrap: wrap; 
    gap: 1rem; 
} 
.camera-status { 
    display: flex; 
    align-items: center; 
    gap: 0.5rem; 
} 
.status-dot { 
    width: 8px; 
    height: 8px; 
    background: #22c55e; 
    border-radius: 50%; 
} 
.camera-feed { 
    aspect-ratio: 16/9; 
    background: #000; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    position: relative; 
    overflow: hidden; 
    min-height: 300px; 
} 
.camera-feed img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
} 
.camera-info { 
    padding: 1rem 1.5rem; 
    display: flex; 
    justify-content: space-between; 
    color: #94a3b8; 
    font-size: 0.875rem; 
    flex-wrap: wrap; 
    gap: 0.5rem; 
} 
</style> 
{% endblock %} 

{% block content %} 
<div class="camera-container"> 
    <div class="camera-header"> 
        <h2>Live Camera Feed</h2> 
        <div style="display:flex; align-items:center; gap:1rem; flex-wrap:wrap;"> 
            <div class="camera-status"> 
                <div class="status-dot" id="statusDot"></div> 
                <span style="color: #22c55e; font-size: 0.875rem;" id="statusText">LIVE</span> 
            </div> 
        </div> 
    </div> 
    
    <div class="camera-feed" id="feedContainer"> 
        <img src="{{ url_for('video_feed') }}" alt="Live Security Feed Unavailable" onerror="handleStreamError()"> 
    </div> 
    
    <div class="camera-info"> 
        <span>Camera 1 - Main Entrance</span> 
        <span id="timestamp">{{ now().strftime('%Y-%m-%d %H:%M:%S UTC') }}</span> 
    </div> 
</div> 
{% endblock %} 

{% block extra_js %} 
<script> 
function handleStreamError() {
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    if(statusDot && statusText) {
        statusDot.style.background = '#dc2626';
        statusText.textContent = 'ERROR / OFFLINE';
        statusText.style.color = '#dc2626';
    }
}

// Update timestamp every second 
setInterval(() => { 
    const el = document.getElementById('timestamp'); 
    if (el) { 
        const now = new Date(); 
        el.textContent = now.toISOString().slice(0,19).replace('T',' ') + ' UTC'; 
    } 
}, 1000); 
</script> 
{% endblock %}
